name: CI

on:
  push:
    branches: [main, dev]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/postgres
      DIRECT_URL: postgresql://user:pass@localhost:5432/postgres
      APP_SECRET: ci-only-secret-not-used-at-runtime
      OPENROUTER_API_KEY: sk-or-v1-ci-placeholder

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      - run: npm run build
